---
services:
  web:
    build:
      context: '.'
      dockerfile: Dockerfile.dev
    command: pnpm dev:app
    environment:
      VITE_ADMIN_APP_URL: '${ADMIN_APP_URL:-http://localhost:3001}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    develop:
      watch:
        - action: sync
          path: '.'
          target: '/app'
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - '.git/'
            - '.env'
            - '.env.*'
            - '*.tsbuildinfo'
            - package.json
            - pnpm-lock.yaml
            - Dockerfile*
            - compose*.yaml
        - action: rebuild
          path: './pnpm-lock.yaml'
        - action: rebuild
          path: './package.json'
        - action: rebuild
          path: './Dockerfile.dev'
