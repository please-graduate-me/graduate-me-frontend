---
services:
  web:
    build:
      context: '.'
      dockerfile: Dockerfile.dev
    command: pnpm dev:app
    develop:
      watch:
        - action: sync
          path: '.'
          target: '/app'
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - '.next/'
            - '.git/'
            - '.env'
            - '.env.*'
            - '.agents/'
            - '*.tsbuildinfo'
            - package.json
            - pnpm-lock.yaml
            - Dockerfile*
            - compose*.yaml
        - action: rebuild
          path: './pnpm-lock.yaml'
        - action: rebuild
          path: './package.json'
        - action: rebuild
          path: './Dockerfile.dev'
