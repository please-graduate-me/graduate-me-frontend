---
name: graduate-me-frontend
services:
  web:
    build:
      context: '.'
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_APP_URL: '${ADMIN_APP_URL:-}'
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:3000/healthz',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - app
networks:
  app:
    name: graduate-me-app
    external: true
